; Puente USB para la microSD de la XIAO Expansion Board.
;
; Expone la tarjeta que hay en la ranura de la expansion board como una unidad
; USB normal, para poder copiarle archivos desde el PC cuando no hay lector de
; tarjetas a mano. Es una herramienta, no parte del producto: graba esto, copia
; lo que necesites, y vuelve a grabar el firmware de ../../firmware.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Modo por defecto de la placa: el USB es el puerto serie por hardware.
    ; Mas fiable para leer el diagnostico que el modo OTG (TinyUSB) que haria
    ; falta para Mass Storage — y aqui no hace falta.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
