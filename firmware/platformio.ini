; Mesero AI — reSpeaker XVF3800 + XIAO ESP32S3
;
; The board keeps its factory I2S firmware. The XIAO reads the audio the XMOS has
; already cleaned up (AEC, beamforming, noise suppression) and streams it to the
; backend over WiFi, then plays the agent's reply back out the same I2S bus.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The native-USB CDC port does not survive esptool's jump to 460800 on every
; host. 115200 costs a few seconds and always works.
upload_speed = 115200

lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Serial over the XIAO's native USB, so the monitor works on the same cable
    ; used for flashing.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
