<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <title>Mesero AI — board-to-board signals</title>
  <desc>Pin map for the I2S audio bus and the I2C control channel, read from the firmware.</desc>
  <rect width="1600" height="100%" fill="#FFFFFF"/>
  <text x="60" y="62" font-size="34" fill="#1A1411" font-weight="700">Mesero AI — board-to-board signals</text>
  <text x="60" y="90" font-size="16.5" fill="#5C534C">Six signals cross between the two boards. Every number here is read from the firmware.</text>
  <text x="1540" y="62" font-size="15" fill="#1A1411" font-weight="700" text-anchor="end">GABOTRIX AI®</text>
  <text x="1540" y="86" font-size="13" fill="#7A6E66" text-anchor="end">No wiring — a 14-pin board-to-board seat</text>
  <line x1="60" y1="112" x2="1540" y2="112" stroke="#D8CEC5" stroke-width="2"/>
  <rect x="120" y="176" width="330" height="496" rx="12" fill="#FBF9F7" stroke="#1A1411" stroke-width="2.5"/>
  <text x="285" y="212" font-size="21" fill="#1A1411" font-weight="700" text-anchor="middle">XIAO ESP32S3</text>
  <text x="285" y="236" font-size="13" fill="#5C534C" text-anchor="middle">I²S master · Wi-Fi · USB-C</text>
  <rect x="1150" y="176" width="330" height="496" rx="12" fill="#FBF9F7" stroke="#1A1411" stroke-width="2.5"/>
  <text x="1315" y="212" font-size="21" fill="#1A1411" font-weight="700" text-anchor="middle">reSpeaker XVF3800</text>
  <text x="1315" y="236" font-size="13" fill="#5C534C" text-anchor="middle">XMOS DSP · I²S slave · amplifier</text>
  <text x="430" y="301" font-size="15" fill="#1A1411" font-weight="700" text-anchor="end">D9 · GPIO8</text>
  <line x1="450" y1="296" x2="1150" y2="296" stroke="#1A1411" stroke-width="2.5"/>
  <polygon points="1150,296 1139.73,300.587 1139.73,291.413" fill="#1A1411"/>
  <rect x="704" y="282" width="192" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="301" font-size="15" fill="#1A1411" font-weight="700" text-anchor="middle">I²S BCLK — bit clock</text>
  <text x="1170" y="301" font-size="14" fill="#5C534C">clock in</text>
  <text x="430" y="363" font-size="15" fill="#1A1411" font-weight="700" text-anchor="end">D8 · GPIO7</text>
  <line x1="450" y1="358" x2="1150" y2="358" stroke="#1A1411" stroke-width="2.5"/>
  <polygon points="1150,358 1139.73,362.587 1139.73,353.413" fill="#1A1411"/>
  <rect x="704" y="344" width="192" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="363" font-size="15" fill="#1A1411" font-weight="700" text-anchor="middle">I²S WS — word select</text>
  <text x="1170" y="363" font-size="14" fill="#5C534C">frame in</text>
  <text x="430" y="425" font-size="15" fill="#C9331F" font-weight="700" text-anchor="end">D7 · GPIO44</text>
  <line x1="450" y1="420" x2="1150" y2="420" stroke="#C9331F" stroke-width="3"/>
  <polygon points="1150,420 1139.73,424.587 1139.73,415.413" fill="#C9331F"/>
  <rect x="589.2" y="406" width="421.6" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="425" font-size="15" fill="#C9331F" font-weight="700" text-anchor="middle">I²S DOUT — the agent's voice, out to the speaker</text>
  <text x="1170" y="425" font-size="14" fill="#5C534C">to the amplifier</text>
  <text x="430" y="487" font-size="15" fill="#C9331F" font-weight="700" text-anchor="end">D6 · GPIO43</text>
  <line x1="1150" y1="482" x2="450" y2="482" stroke="#C9331F" stroke-width="3"/>
  <polygon points="450,482 460.272,477.413 460.272,486.587" fill="#C9331F"/>
  <rect x="630.2" y="468" width="339.6" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="487" font-size="15" fill="#C9331F" font-weight="700" text-anchor="middle">I²S DIN — the room, already cleaned up</text>
  <text x="1170" y="487" font-size="14" fill="#5C534C">from the microphones</text>
  <text x="430" y="549" font-size="15" fill="#1A1411" font-weight="700" text-anchor="end">D4 · GPIO5</text>
  <line x1="450" y1="544" x2="1150" y2="544" stroke="#1A1411" stroke-width="2.5"/>
  <polygon points="1150,544 1139.73,548.587 1139.73,539.413" fill="#1A1411"/>
  <polygon points="450,544 460.272,539.413 460.272,548.587" fill="#1A1411"/>
  <rect x="728.6" y="530" width="142.8" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="549" font-size="15" fill="#1A1411" font-weight="700" text-anchor="middle">I²C SDA — data</text>
  <text x="1170" y="549" font-size="14" fill="#5C534C">address 0x2C</text>
  <text x="430" y="611" font-size="15" fill="#1A1411" font-weight="700" text-anchor="end">D5 · GPIO6</text>
  <line x1="450" y1="606" x2="1150" y2="606" stroke="#1A1411" stroke-width="2.5"/>
  <polygon points="1150,606 1139.73,610.587 1139.73,601.413" fill="#1A1411"/>
  <rect x="687.6" y="592" width="224.8" height="28" rx="5" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="800" y="611" font-size="15" fill="#1A1411" font-weight="700" text-anchor="middle">I²C SCL — clock, 100 kHz</text>
  <text x="1170" y="611" font-size="14" fill="#5C534C">bearing, LED ring</text>
  <rect x="120" y="700" width="620" height="150" rx="12" fill="#FBF9F7" stroke="#1A1411" stroke-width="2"/>
  <text x="146" y="732" font-size="16" fill="#1A1411" font-weight="700">The audio format, both directions</text>
  <text x="146" y="762" font-size="14.5" fill="#4A423C">16 000 Hz · 32-bit slots · stereo frame · I²S standard</text>
  <text x="146" y="786" font-size="14.5" fill="#4A423C">One DMA block = 20 ms = 320 samples = 640 bytes of PCM16</text>
  <text x="146" y="810" font-size="14.5" fill="#4A423C">The ESP32 is the master; the XVF3800 follows its clock</text>
  <text x="146" y="834" font-size="14.5" fill="#4A423C">MCLK is not connected — the DSP makes its own</text>
  <rect x="770" y="700" width="710" height="150" rx="12" fill="#FFF4F2" stroke="#C9331F" stroke-width="2"/>
  <text x="796" y="732" font-size="16" fill="#C9331F" font-weight="700">What I²C is for — and the trap inside it</text>
  <text x="796" y="762" font-size="14.5" fill="#4A423C">The control channel reads which direction a phrase came from. That is what</text>
  <text x="796" y="786" font-size="14.5" fill="#4A423C">puts each dish on the right diner's tab, and what drives the LED ring.</text>
  <text x="796" y="812" font-size="14.5" fill="#4A423C">It answers only on XVF3800 firmware 1.0.5. On 1.0.4 the register returns 65535</text>
  <text x="796" y="836" font-size="14.5" fill="#4A423C">for ever: the gadget still takes orders, but cannot tell two diners apart.</text>
  <text x="60" y="878" font-size="13" fill="#7A6E66">Apache-2.0 · github.com/gabotrix/mesero-ai · Seeed Interactive Signage Contest 2026</text>
</svg>
